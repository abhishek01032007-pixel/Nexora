<svg viewBox="0 0 1160 170" width="100%" xmlns="http://www.w3.org/2000/svg" style="background: #0d1117; border-radius: 16px; border: 1px solid #30363d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#161e2e"/>
    </linearGradient>
    <linearGradient id="arrow-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="bundle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Step A: Select Skills -->
  <g transform="translate(24, 20)" filter="url(#bundle-glow)">
    <rect x="0" y="0" width="235" height="130" rx="14" fill="url(#card-grad-2)" stroke="#6366f1" stroke-width="1.8"/>
    <text x="20" y="34" fill="#a5b4fc" font-size="16">🎒</text>
    <text x="48" y="34" fill="#f0f6fc" font-size="14.5" font-weight="700">Select Skills</text>
    <line x1="16" y1="52" x2="219" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#8b949e" font-size="12" font-weight="500">• Pick from My Downloads</text>
    <text x="18" y="100" fill="#8b949e" font-size="12" font-weight="500">• Choose from The Store</text>
  </g>

  <!-- Arrow A -> B -->
  <g transform="translate(267, 85)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="url(#arrow-grad-2)" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 28 -5 L 37 0 L 28 5" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step B: Bundle Editor -->
  <g transform="translate(312, 20)" filter="url(#bundle-glow)">
    <rect x="0" y="0" width="235" height="130" rx="14" fill="url(#card-grad-2)" stroke="#0d9488" stroke-width="1.8"/>
    <text x="20" y="34" fill="#5eead4" font-size="16">⚙️</text>
    <text x="48" y="34" fill="#f0f6fc" font-size="14.5" font-weight="700">Bundle Editor</text>
    <line x1="16" y1="52" x2="219" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#8b949e" font-size="12" font-weight="500">• Set Name &amp; Category</text>
    <text x="18" y="100" fill="#8b949e" font-size="12" font-weight="500">• Customize Rule Overrides</text>
  </g>

  <!-- Arrow B -> C -->
  <g transform="translate(555, 85)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="url(#arrow-grad-2)" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 28 -5 L 37 0 L 28 5" fill="none" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step C: Saved Bundle Pack -->
  <g transform="translate(600, 20)" filter="url(#bundle-glow)">
    <rect x="0" y="0" width="235" height="130" rx="14" fill="url(#card-grad-2)" stroke="#db2777" stroke-width="1.8"/>
    <text x="20" y="34" fill="#fbcfe8" font-size="16">📦</text>
    <text x="48" y="34" fill="#f0f6fc" font-size="14.5" font-weight="700">Saved Bundle Pack</text>
    <line x1="16" y1="52" x2="219" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#8b949e" font-size="12" font-weight="500">• Versioned Stacks Saved</text>
    <text x="18" y="100" fill="#8b949e" font-size="12" font-weight="500">• Fork Official Packs</text>
  </g>

  <!-- Arrow C -> D -->
  <g transform="translate(843, 85)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="url(#arrow-grad-2)" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 28 -5 L 37 0 L 28 5" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step D: 1-Click Fleet Deploy -->
  <g transform="translate(888, 20)" filter="url(#bundle-glow)">
    <rect x="0" y="0" width="245" height="130" rx="14" fill="url(#card-grad-2)" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="34" fill="#34d399" font-size="16">🚀</text>
    <text x="48" y="34" fill="#f0f6fc" font-size="14.5" font-weight="700">1-Click Fleet Deploy</text>
    <line x1="16" y1="52" x2="229" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#34d399" font-size="12" font-weight="600">• Write to All Workspaces</text>
    <text x="18" y="100" fill="#34d399" font-size="12" font-weight="600">• Zero Manual Copying</text>
  </g>
</svg>