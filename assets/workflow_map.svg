<svg viewBox="0 0 1160 170" width="100%" xmlns="http://www.w3.org/2000/svg" style="background: #0d1117; border-radius: 16px; border: 1px solid #30363d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Step 1: Connect Workspace -->
  <g transform="translate(24, 20)" filter="url(#card-glow)">
    <rect x="0" y="0" width="235" height="130" rx="14" fill="url(#card-grad-1)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="28" y="33" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text x="50" y="33" fill="#f0f6fc" font-size="14.5" font-weight="700">Connect Workspace</text>
    <line x1="16" y1="52" x2="219" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#8b949e" font-size="12" font-weight="500">• Auto-detect tech stack</text>
    <text x="18" y="100" fill="#8b949e" font-size="12" font-weight="500">• Initialize 5 AI targets</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(267, 85)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="url(#arrow-grad)" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 28 -5 L 37 0 L 28 5" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2: Skill Studio -->
  <g transform="translate(312, 20)" filter="url(#card-glow)">
    <rect x="0" y="0" width="235" height="130" rx="14" fill="url(#card-grad-1)" stroke="#818cf8" stroke-width="1.8"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="rgba(129, 140, 248, 0.15)"/>
    <text x="28" y="33" fill="#818cf8" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text x="50" y="33" fill="#f0f6fc" font-size="14.5" font-weight="700">Skill Studio</text>
    <line x1="16" y1="52" x2="219" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#8b949e" font-size="12" font-weight="500">• Browse The Store</text>
    <text x="18" y="100" fill="#8b949e" font-size="12" font-weight="500">• Author custom skills</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(555, 85)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="url(#arrow-grad)" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 28 -5 L 37 0 L 28 5" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3: Skill Wallet -->
  <g transform="translate(600, 20)" filter="url(#card-glow)">
    <rect x="0" y="0" width="235" height="130" rx="14" fill="url(#card-grad-1)" stroke="#c084fc" stroke-width="1.8"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="rgba(192, 132, 252, 0.15)"/>
    <text x="28" y="33" fill="#c084fc" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text x="50" y="33" fill="#f0f6fc" font-size="14.5" font-weight="700">Skill Wallet</text>
    <line x1="16" y1="52" x2="219" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#8b949e" font-size="12" font-weight="500">• Manage Vault &amp; Bundles</text>
    <text x="18" y="100" fill="#8b949e" font-size="12" font-weight="500">• Token Headroom Check</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(843, 85)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="url(#arrow-grad)" stroke-width="2.5" stroke-dasharray="4 3"/>
    <path d="M 28 -5 L 37 0 L 28 5" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 4: Fleet Deploy -->
  <g transform="translate(888, 20)" filter="url(#card-glow)">
    <rect x="0" y="0" width="245" height="130" rx="14" fill="url(#card-grad-1)" stroke="#10b981" stroke-width="2"/>
    <rect x="14" y="14" width="28" height="28" rx="8" fill="rgba(16, 185, 129, 0.18)"/>
    <text x="28" y="33" fill="#34d399" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text x="50" y="33" fill="#f0f6fc" font-size="14.5" font-weight="700">Fleet Deploy</text>
    <line x1="16" y1="52" x2="229" y2="52" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="78" fill="#34d399" font-size="12" font-weight="600">• 1-Click Multi-IDE Sync</text>
    <text x="18" y="100" fill="#34d399" font-size="12" font-weight="600">• 100% Atomic Commit</text>
  </g>
</svg>